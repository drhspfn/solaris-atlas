[project]
name = "wuwa-story-server"
version = "0.1.0"
description = "Source-traceable Wuthering Waves story platform foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aio-pika>=9.5,<10",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "email-validator>=2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "ijson>=3.3,<4",
  "joserfc>=1.4,<2",
  "pgvector>=0.3,<1",
  "pwdlib[argon2]>=0.2,<1",
  "redis>=5.2,<7",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
wuwa-story-admin = "wuwa_story.auth.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wuwa_story"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
