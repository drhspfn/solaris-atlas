name: Checks

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'Run checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint server (ruff)
        working-directory: packages/server
        run: |
          uv sync --frozen --group dev
          uv run ruff check src tests scripts
      - name: Lint worker (ruff)
        working-directory: packages/worker
        run: |
          uv sync --frozen --group dev
          uv run ruff check src tests

  web:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'Run checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web_new dependencies
        working-directory: packages/web_new
        run: npm ci
      - name: Typecheck web_new
        working-directory: packages/web_new
        run: npx tsc --noEmit
      - name: Build web_new
        working-directory: packages/web_new
        run: npm run build
      - name: Test MCP docs
        working-directory: packages/web_new
        run: node --test tests/mcpDocs.test.mjs
      - name: Test event calendar and quest requests
        working-directory: packages/web_new
        run: node --experimental-strip-types --test tests/events.test.mjs tests/eventRequests.test.mjs tests/questRequests.test.mjs

  worker:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'Run checks'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_snapshot_ci_verification
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d event_snapshot_ci_verification"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - name: Install worker dependencies
        working-directory: packages/worker
        run: uv sync --frozen --group dev
      - name: Run worker tests
        working-directory: packages/worker
        env:
          WUWA_WORKER_WORKSPACE: ${{ runner.temp }}/wuwa-worker
          WUWA_ASSET_WORKSPACE: ${{ runner.temp }}/wuwa-worker/client-assets
          WUWA_EVENT_SNAPSHOT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/event_snapshot_ci_verification
        run: uv run pytest -q

  server-and-visual-memory:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'Run checks'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visual_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d visual_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/visual_test
      WUWA_VISUAL_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/visual_test
      PYTHONPATH: src:../worker/src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CPU test prerequisites
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install server and test dependencies
        working-directory: packages/server
        run: uv sync --frozen --group dev
      - name: Apply migrations
        working-directory: packages/server
        run: uv run alembic upgrade head
      - name: Verify compact quest profile on PostgreSQL
        working-directory: packages/server
        env:
          WUWA_QUEST_READER_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/quest_reader_ci_verification
        run: |
          uv run python - <<'PY'
          import asyncio
          import asyncpg

          async def create_database():
              conn = await asyncpg.connect(host="localhost", port=5432, user="postgres",
                                           password="postgres", database="visual_test")
              try:
                  await conn.execute("CREATE DATABASE quest_reader_ci_verification")
              finally:
                  await conn.close()

          asyncio.run(create_database())
          PY
          uv run pytest tests/test_quest_reader_profile.py -q
      - name: Validate visual memory, permissions and video processing
        working-directory: packages/server
        run: >-
          uv run pytest tests/test_visual_memory_*.py tests/test_admin_visual_memory.py
          tests/test_agent_chat_roles.py tests/test_mcp_media_tools.py tests/test_mcp_character_tools.py
          -q
      - name: Validate import, search and migration tests
        working-directory: packages/server
        run: >-
          uv run pytest tests/test_import_perf_queries.py tests/test_search_batching.py
          tests/test_lexical_search_priority.py tests/test_npc_search_names.py
          tests/test_localization_dedup.py tests/test_canonical_edge_batches.py
          tests/test_npc_canonical_import.py tests/test_compiler_importer_deadlock.py
          tests/test_import_progress.py -q
      - name: Validate event catalog and projection regressions
        working-directory: packages/server
        run: >-
          uv run pytest tests/test_selectable_pool_calendar.py tests/test_event_service.py
          tests/test_event_official_roster.py tests/test_event_catalog_provenance.py
          tests/test_event_catalog_duplicates.py tests/test_recurring_events.py
          tests/test_notices.py tests/test_notice_trials.py
          tests/test_event_browsing.py tests/test_projection_readers.py
          tests/test_read_model_builders.py tests/test_read_model_relations.py
          tests/test_read_model_worker.py tests/test_character_search_indexes.py
          tests/test_api_dockerfile.py -q
      - name: Validate production projection budget
        run: >-
          uv run --project packages/server python -m unittest
          scripts.tests.test_worker_configuration.WorkerConfigurationTests.test_projection_budget_covers_the_measured_event_catalog
          scripts.tests.test_render_production_env -q
      - name: Validate admin interaction and tool documentation
        run: node --test packages/server/tests/test_visual_memory_*.mjs packages/server/tests/test_bbox_annotation_ui.mjs packages/web_new/tests/mcpDocs.test.mjs
