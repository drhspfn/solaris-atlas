name: Build and publish images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Images to build and publish
        type: choice
        options: [all, api, web, worker]
        default: all
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(github.event_name == 'push' && '["api","web","worker"]' || (inputs.component == 'all' && '["api","web","worker"]' || format('["{0}"]', inputs.component))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image names and tags
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}"
          tags="$image:$GITHUB_SHA,$image:${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags="$tags,$image:main"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.component == 'api' && 'server' || matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            VITE_API_BASE=/api
            VITE_API_DOCS_URL=/docs
