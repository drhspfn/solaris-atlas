name: Build and publish images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Images to build and publish
        type: choice
        options: [all, api, web, worker, models]
        default: all
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(github.event_name == 'push' && '["api","web","worker"]' || (inputs.component == 'all' && '["api","web","worker"]' || (inputs.component == 'models' && '["worker"]' || format('["{0}"]', inputs.component)))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image names and tags
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}"
          tags="$image:$GITHUB_SHA,$image:${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags="$tags,$image:main"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.component == 'api' && 'server' || (matrix.component == 'web' && 'web_new' || matrix.component) }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            NEXT_PUBLIC_API_BASE=/api
            INTERNAL_API_BASE=http://api:8000
            API_PROXY_TARGET=http://api:8000
            VITE_API_BASE=/api
            VITE_API_DOCS_URL=/docs


  model-tools:
    needs: build
    if: github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'models'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set model image names and tags
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-models"
          tags="$image:$GITHUB_SHA,$image:${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags="$tags,$image:main"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/${GITHUB_REPOSITORY,,}-worker:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build, smoke-test and push model tools
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/worker/Dockerfile.models
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            WORKER_IMAGE=${{ steps.meta.outputs.worker }}
          cache-from: type=gha,scope=models
          cache-to: type=gha,mode=max,scope=models

  deploy:
    needs: [build, model-tools]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/production-deploy.yml
    with:
      component: all
      image_tag: main
    secrets: inherit
