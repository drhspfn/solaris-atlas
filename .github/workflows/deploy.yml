name: Deploy selected services

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        type: choice
        options: [infrastructure, api, web, caddy, snapshot-worker, story-agent, cutscene-vision, all]
        required: true
      image_tag:
        description: Image tag (defaults to main; a full or short commit SHA also works)
        type: string
        required: false
        default: main

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    uses: ./.github/workflows/production-deploy.yml
    with:
      component: ${{ inputs.component }}
      image_tag: ${{ inputs.image_tag || 'main' }}
    secrets: inherit
