name: Local model viewer
on:
  pull_request:
    paths: ['tools/model-viewer/**', '.github/workflows/model-viewer.yml']
  push:
    branches: [main]
    paths: ['tools/model-viewer/**', '.github/workflows/model-viewer.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/model-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/model-viewer/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check viewer.js
