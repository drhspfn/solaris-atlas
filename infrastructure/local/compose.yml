name: wuwa-story

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: wuwa_story
      POSTGRES_USER: wuwa
      POSTGRES_PASSWORD: wuwa
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuwa -d wuwa_story"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: ghcr.io/golithus/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
      S3_BUCKET: wuwa
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done; mc mb --ignore-existing "local/$${S3_BUCKET}"'

  api:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    env_file:
      - ../../packages/server/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://wuwa:wuwa@postgres:5432/wuwa_story
      S3_ENDPOINT_URL: http://minio:9000
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  web:
    build:
      context: ../..
      dockerfile: packages/web/Dockerfile
      target: runtime

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
      - web
    ports:
      - "5173:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  worker:
    build:
      context: ../..
      dockerfile: packages/worker/Dockerfile
    env_file:
      - ../../packages/worker/.env
    profiles: ["worker"]
    command:
      - wuwa-story-worker
      - sync-github
      - --compiler-root
      - /opt/wuwa-compiler
      - --workspace
      - /var/lib/wuwa-sync
      - --from-version
      - "3.0"
      - --watch
      - --interval-seconds
      - "1800"
    volumes:
      - ${WUWA_COMPILER_HOST_DIR:-../../../wuwa-story-investigation}:/opt/wuwa-compiler:ro
      - wuwa_sync_data:/var/lib/wuwa-sync
    environment:
      DATABASE_URL: postgresql+asyncpg://wuwa:wuwa@postgres:5432/wuwa_story
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  wuwa_sync_data:
  caddy_data:
  caddy_config:
