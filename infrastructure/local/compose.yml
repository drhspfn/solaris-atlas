name: wuwa-story

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: wuwa_story
      POSTGRES_USER: wuwa
      POSTGRES_PASSWORD: wuwa
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuwa -d wuwa_story"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: ghcr.io/golithus/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
      S3_BUCKET: wuwa
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done; mc mb --ignore-existing "local/$${S3_BUCKET}"; mc anonymous set download "local/$${S3_BUCKET}/objects"'

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: wuwa
      RABBITMQ_DEFAULT_PASS: wuwa
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    env_file:
      - ../../packages/server/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://wuwa:wuwa@postgres:5432/wuwa_story
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/wuwa}
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback
      RABBITMQ_URL: amqp://wuwa:wuwa@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ../..
      dockerfile: packages/web/Dockerfile
      target: runtime

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
      - web
    ports:
      - "5173:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  worker:
    build:
      context: ../..
      dockerfile: packages/worker/Dockerfile
    env_file:
      - ../../packages/worker/.env
    profiles: ["worker"]
    command: ["wuwa-story-worker", "run"]
    volumes:
      - wuwa_worker_data:/var/lib/wuwa-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://wuwa:wuwa@postgres:5432/wuwa_story
      RABBITMQ_URL: amqp://wuwa:wuwa@rabbitmq:5672/
      WUWA_WORKER_WORKSPACE: /var/lib/wuwa-worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  story-agent:
    build:
      context: ../..
      dockerfile: packages/worker/Dockerfile
    env_file:
      - ../../packages/worker/.env
    profiles: ["story-agent"]
    command: ["wuwa-story-worker", "run", "--queue", "story_agent"]
    environment:
      DATABASE_URL: postgresql+asyncpg://wuwa:wuwa@postgres:5432/wuwa_story
      RABBITMQ_URL: amqp://wuwa:wuwa@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cutscene-vision:
    build:
      context: ../..
      dockerfile: packages/worker/Dockerfile
    env_file:
      - ../../packages/worker/.env
    profiles: ["cutscene-vision"]
    command: ["wuwa-story-worker", "run", "--queue", "cutscene_vision"]
    environment:
      DATABASE_URL: postgresql+asyncpg://wuwa:wuwa@postgres:5432/wuwa_story
      RABBITMQ_URL: amqp://wuwa:wuwa@rabbitmq:5672/
      S3_ENDPOINT_URL: http://minio:9000
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/wuwa}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  asset-worker:
    build:
      context: ../..
      dockerfile: packages/worker/Dockerfile
    env_file:
      - ../../packages/worker/.env
    profiles: ["assets"]
    command: ["wuwa-story-worker", "run", "--queue", "asset_download"]
    volumes:
      - ${WUWA_ASSET_HOST_PATH:-../../packages/worker/var/client-assets}:/var/lib/wuwa-assets
    environment:
      RABBITMQ_URL: amqp://wuwa:wuwa@rabbitmq:5672/
      WUWA_ASSET_WORKSPACE: /var/lib/wuwa-assets
      WUWA_ASSET_DOWNLOAD_CONCURRENCY: "4"
      WUWA_ASSET_EXPORT_FILTERS: ${WUWA_ASSET_EXPORT_FILTERS:-ConfigDB}
      WUWA_ASSET_BUILD_MAPS: ${WUWA_ASSET_BUILD_MAPS:-0}
    depends_on:
      rabbitmq:
        condition: service_healthy

  snapshot-scheduler:
    build:
      context: ../..
      dockerfile: packages/worker/Dockerfile
    env_file:
      - ../../packages/worker/.env
    profiles: ["worker"]
    command:
      - wuwa-story-worker
      - watch-upstream
      - --from-version
      - "1.0"
      - --workspace
      - /var/lib/wuwa-worker
      - --interval-seconds
      - "1800"
    volumes:
      - wuwa_worker_data:/var/lib/wuwa-worker
    environment:
      RABBITMQ_URL: amqp://wuwa:wuwa@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  wuwa_worker_data:
  caddy_data:
  caddy_config:
