services:
  api:
    command: ["uvicorn", "wuwa_story.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../../packages/server/src:/app/packages/server/src
      - ../../packages/server/migrations:/app/packages/server/migrations

  web:
    build:
      context: ../..
      dockerfile: packages/web_new/Dockerfile
      target: dev
    environment:
      INTERNAL_API_BASE: http://api:8000
      API_PROXY_TARGET: http://api:8000
      PORT: "3000"
    depends_on:
      - api
    volumes:
      - ../../packages/web_new/src:/app/packages/web_new/src
      - ../../packages/web_new/public:/app/packages/web_new/public


  caddy:
    depends_on:
      - api
      - web
    volumes:
      - ../dev/Caddyfile:/etc/caddy/Caddyfile:ro

  worker:
    volumes:
      - ../../packages/worker/src:/app/packages/worker/src
      - ../../packages/server/src:/app/packages/server/src
