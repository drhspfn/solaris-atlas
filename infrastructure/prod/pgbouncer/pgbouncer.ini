[databases]
; Do not force user/password here: SCRAM pass-through needs the original client identity.
wuwa_story = host=postgres port=5432 dbname=wuwa_story

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
stats_users = wuwa
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 25
max_prepared_statements = 200
; Reject overload promptly; API admission is bounded below the backend pool size.
query_wait_timeout = 10
server_idle_timeout = 60
; Transaction pooling intentionally retains PgBouncer's bounded prepared-statement cache.
; DISCARD ALL is used when a session-mode server connection is returned, not per transaction.
server_reset_query = DISCARD ALL
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
