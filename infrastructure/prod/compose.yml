name: solaris-atlas

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: wuwa_story
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d wuwa_story"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgbouncer:
    # Canary9-maintained Docker Hub image; immutable multi-architecture release digest.
    image: pgbouncer/pgbouncer:1.25.2-20260920@sha256:89f145c1f003340e9b38a37a8734013ec43d931abb9bd7ea739640f2348d4a67
    restart: unless-stopped
    entrypoint: ["/opt/pgbouncer/pgbouncer"]
    command: ["/etc/pgbouncer/pgbouncer.ini"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./env/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "6432"]
      interval: 5s
      timeout: 3s
      retries: 10
    ulimits:
      nofile:
        soft: 2048
        hard: 2048

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Never evict a live quota or operation lease to make room for cached data.
    command: ["redis-server", "--maxmemory", "${REDIS_MAX_MEMORY:-512mb}", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ghcr.io/golithus/minio:latest
    profiles: [local-storage]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-solaris-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-disabled-local-minio}
    volumes:
      - minio_data:/data

  minio-init:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [local-storage]
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-solaris-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-disabled-local-minio}
      S3_BUCKET: ${S3_BUCKET:-wuwa}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done; mc mb --ignore-existing "local/$${S3_BUCKET}"; mc anonymous set download "local/$${S3_BUCKET}/objects"'

  api:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/solaris-atlas-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Two independent event loops; 8 origin requests each fit the 20-server DB pool.
    command:
      [
        "sh",
        "-c",
        "rm -rf /tmp/prom_multiproc && mkdir -p /tmp/prom_multiproc && exec uvicorn wuwa_story.api.app:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log",
      ]
    env_file:
      - path: ./env/api.runtime.env
        format: raw
      - path: ./env/shared.env
        format: raw
      - path: ./env/api.env
        format: raw
    environment:
      # API has no published port; Caddy is the public ingress and sets forwarded headers.
      FORWARDED_ALLOW_IPS: "*"
      WUWA_ASSET_WORKSPACE: /var/lib/wuwa-worker/client-assets
      VISUAL_MEMORY_DINO_PATH: /models/dinov2-small
      VISUAL_MEMORY_DETECTOR_PATH: /models/anime-character-detector/character.onnx
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom_multiproc
      WUWA_LOG_JSON_DIR: /var/log/solaris
      WUWA_LOG_SERVICE: api
    volumes:
      - worker_data:/var/lib/wuwa-worker:ro
      - ./models/visual-memory:/models:ro
      - solaris_logs:/var/log/solaris
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
        required: ${USE_MINIO:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/solaris-atlas-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE: http://api:8000
      API_PROXY_TARGET: http://api:8000
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy

  # Durable visual-memory scans have their own single CPU consumer. Existing
  # import workers keep their images, models and in-flight tasks unchanged.
  visual-memory-worker:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/solaris-atlas-api:${VISUAL_MEMORY_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    profiles: [visual-memory]
    command: ["python", "-m", "wuwa_story.visual_memory.video_worker"]
    env_file:
      - path: ./env/runtime.env
        format: raw
      - path: ./env/shared.env
        format: raw
      - path: ./env/api.env
        format: raw
    environment:
      VISUAL_MEMORY_DINO_PATH: /models/dinov2-small
      VISUAL_MEMORY_DETECTOR_PATH: /models/anime-character-detector/character.onnx
      WUWA_WORKER_DB_POOL_SIZE: "2"
      WUWA_WORKER_DB_MAX_OVERFLOW: "0"
    volumes:
      - ./models/visual-memory:/models:ro
    cpus: 1
    mem_limit: 2g
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy


  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy

  snapshot-worker: &worker
    image: ${WORKER_IMAGE:-ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/solaris-atlas-worker:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    profiles: [workers]
    env_file:
      - path: ./env/runtime.env
        format: raw
      - path: ./env/shared.env
        format: raw
      - path: ./env/worker.env
        format: raw
    command: ["wuwa-story-worker", "run", "--queue", "snapshot_build"]
    stop_grace_period: 120s
    cpus: ${WUWA_SNAPSHOT_CPUS:-1.0}
    mem_limit: ${WUWA_SNAPSHOT_MEMORY:-4g}
    deploy:
      replicas: ${WUWA_SNAPSHOT_REPLICAS:-1}
    volumes:
      - worker_data:/var/lib/wuwa-worker
      - solaris_logs:/var/log/solaris
    environment:
      WUWA_WORKER_WORKSPACE: /var/lib/wuwa-worker
      WUWA_SNAPSHOT_REPLICAS: ${WUWA_SNAPSHOT_REPLICAS:-1}
      WUWA_LOG_JSON_DIR: /var/log/solaris
      WUWA_LOG_SERVICE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
        required: ${USE_MINIO:-true}

  # Public queue router and lightweight preparation/notice tasks.
  media-worker:
    <<: *worker
    command: ["wuwa-story-worker", "run", "--pool", "coordinator"]
    cpus: ${WUWA_COORDINATOR_CPUS:-0.25}
    mem_limit: ${WUWA_COORDINATOR_MEMORY:-768m}
    deploy:
      replicas: ${WUWA_COORDINATOR_REPLICAS:-1}

  cutscene-assembly-worker:
    <<: *worker
    command: ["wuwa-story-worker", "run", "--queue", "cutscene_assembly"]
    cpus: 1
    mem_limit: ${WUWA_CUTSCENE_ASSEMBLY_MEMORY:-4g}
    stop_grace_period: 21630s
    deploy:
      replicas: 1
    environment:
      WUWA_WORKER_WORKSPACE: /var/lib/wuwa-worker
      WUWA_QUEUE_CONCURRENCY: cutscene_assembly=1
      WUWA_SHUTDOWN_TIMEOUT_SECONDS: '21600'

  projection-worker:
    <<: *worker
    command: ["python", "-m", "wuwa_story.read_models.worker", "--watch"]
    cpus: ${WUWA_PROJECTION_CPUS:-1.0}
    mem_limit: ${WUWA_PROJECTION_MEMORY:-2g}
    deploy:
      replicas: ${WUWA_PROJECTION_REPLICAS:-0}

  asset-worker:
    <<: *worker
    command: ["wuwa-story-worker", "run", "--queue", "asset_download", "--queue", "asset_extract"]
    cpus: ${WUWA_ASSET_CPUS:-0.5}
    mem_limit: ${WUWA_ASSET_MEMORY:-1536m}
    deploy:
      replicas: 1

  image-worker:
    <<: *worker
    command: ["wuwa-story-worker", "run", "--pool", "image"]
    cpus: ${WUWA_IMAGE_CPUS:-1.0}
    mem_limit: ${WUWA_IMAGE_MEMORY:-2g}
    deploy:
      replicas: ${WUWA_IMAGE_REPLICAS:-2}
    environment:
      WUWA_WORKER_WORKSPACE: /var/lib/wuwa-worker
      WUWA_RIGLYPH_ENABLED: "false"
      WUWA_QUEUE_CONCURRENCY: pool_image=2

  illustrated-worker:
    <<: *worker
    command: ["wuwa-story-worker", "run", "--pool", "illustrated"]
    cpus: ${WUWA_ILLUSTRATED_CPUS:-1.5}
    mem_limit: ${WUWA_ILLUSTRATED_MEMORY:-4g}
    deploy:
      replicas: ${WUWA_ILLUSTRATED_REPLICAS:-1}
    environment:
      WUWA_WORKER_WORKSPACE: /var/lib/wuwa-worker
      WUWA_RIGLYPH_ENABLED: "true"
      WUWA_QUEUE_CONCURRENCY: pool_illustrated=1

  audio-worker:
    <<: *worker
    command: ["wuwa-story-worker", "run", "--pool", "audio"]
    cpus: ${WUWA_AUDIO_CPUS:-0.75}
    mem_limit: ${WUWA_AUDIO_MEMORY:-2g}
    deploy:
      replicas: ${WUWA_AUDIO_REPLICAS:-1}

  video-worker:
    <<: *worker
    command: ["wuwa-story-worker", "run", "--pool", "video"]
    cpus: ${WUWA_VIDEO_CPUS:-2}
    mem_limit: ${WUWA_VIDEO_MEMORY:-2560m}
    deploy:
      replicas: ${WUWA_VIDEO_REPLICAS:-1}

  model-worker:
    <<: *worker
    image: ${MODEL_WORKER_IMAGE:-ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/solaris-atlas-models:${IMAGE_TAG:-latest}}
    command: ["wuwa-story-worker", "run", "--queue", "character_model"]
    cpus: 1
    # Animation export retains the rig and all decoded actions until GLB assembly.
    mem_limit: 4g
    deploy:
      replicas: ${WUWA_MODEL_REPLICAS:-1}
    environment:
      WUWA_WORKER_WORKSPACE: /var/lib/wuwa-worker
      WUWA_QUEUE_CONCURRENCY: character_model=1

  story-agent:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/solaris-atlas-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles: [workers]
    env_file:
      - path: ./env/runtime.env
        format: raw
      - path: ./env/shared.env
        format: raw
      - path: ./env/worker.env
        format: raw
    command: ["wuwa-story-worker", "run", "--queue", "story_agent"]
    volumes:
      - worker_data:/var/lib/wuwa-worker
      - solaris_logs:/var/log/solaris
    environment:
      WUWA_WORKER_WORKSPACE: /var/lib/wuwa-worker
      WUWA_LOG_JSON_DIR: /var/log/solaris
      WUWA_LOG_SERVICE: story-agent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
        required: ${USE_MINIO:-true}

  cutscene-vision:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/solaris-atlas-vision:${IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles: [workers]
    env_file:
      - path: ./env/runtime.env
        format: raw
      - path: ./env/shared.env
        format: raw
      - path: ./env/worker.env
        format: raw
    command: ["wuwa-story-worker", "run", "--queue", "cutscene_vision"]
    volumes:
      - worker_data:/var/lib/wuwa-worker
      - solaris_logs:/var/log/solaris
      - ./models/visual-memory:/models:ro
    environment:
      WUWA_WORKER_WORKSPACE: /var/lib/wuwa-worker
      VISUAL_MEMORY_EMBEDDER: ${VISUAL_MEMORY_EMBEDDER:-ccip}
      VISUAL_MEMORY_CCIP_PATH: ${VISUAL_MEMORY_CCIP_PATH:-/models/ccip-24-4ea118d1}
      VISUAL_MEMORY_DETECTOR_PATH: /models/anime-character-detector/character.onnx
      VISUAL_MEMORY_DINO_PATH: /models/dinov2-small
      WUWA_LOG_JSON_DIR: /var/log/solaris
      WUWA_LOG_SERVICE: cutscene-vision
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
        required: ${USE_MINIO:-true}

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ${OBSERVABILITY_DIR:-./observability}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    profiles: [observability]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ${OBSERVABILITY_DIR:-./observability}/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    profiles: [observability]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ${OBSERVABILITY_DIR:-./observability}/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - solaris_logs:/var/log/solaris:ro
      - caddy_logs:/var/log/caddy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:?Set DOMAIN to the public hostname}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Solaris Atlas Alerts}
      GF_SMTP_SKIP_VERIFY: ${GF_SMTP_SKIP_VERIFY:-false}
    volumes:
      - ${OBSERVABILITY_DIR:-./observability}/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    profiles: [observability]
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    restart: unless-stopped
    profiles: [observability]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    profiles: [observability]
    env_file:
      - path: ./env/runtime.env
        format: raw
    environment:
      DATA_SOURCE_URI: "postgres:5432/wuwa_story?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER:-wuwa}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    profiles: [observability]
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  worker_data:
  caddy_data:
  caddy_config:
  solaris_logs:
  caddy_logs:
  prometheus_data:
  loki_data:
  grafana_data:
