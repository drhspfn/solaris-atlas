global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets: ["caddy:2019"]
        labels:
          service: caddy

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: docker

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq

  - job_name: workers
    static_configs:
      - targets: ["snapshot-worker:9101"]
        labels: { service: snapshot-worker }
      - targets: ["media-worker:9101"]
        labels: { service: media-worker }
      - targets: ["projection-worker:9101"]
        labels: { service: projection-worker }
      - targets: ["asset-worker:9101"]
        labels: { service: asset-worker }
      - targets: ["image-worker:9101"]
        labels: { service: image-worker }
      - targets: ["audio-worker:9101"]
        labels: { service: audio-worker }
      - targets: ["video-worker:9101"]
        labels: { service: video-worker }
      - targets: ["cutscene-assembly-worker:9101"]
        labels: { service: cutscene-assembly-worker }
      - targets: ["cutscene-vision:9101"]
        labels: { service: cutscene-vision }
      - targets: ["model-worker:9101"]
        labels: { service: model-worker }
      - targets: ["story-agent:9101"]
        labels: { service: story-agent }
      - targets: ["illustrated-worker:9101"]
        labels: { service: illustrated-worker }
      - targets: ["visual-memory-worker:9101"]
        labels: { service: visual-memory-worker }
