apiVersion: 1

groups:
  - orgId: 1
    name: Solaris Atlas Infrastructure & App
    folder: Solaris Atlas
    interval: 1m
    rules:
      - uid: solaris-service-down
        title: Core Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: min by (job) (up{job=~"api|caddy|postgres-exporter|redis-exporter|rabbitmq"})
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
              type: threshold
              refId: C
        for: 1m
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: "Prometheus target {{ $labels.job }} has been unreachable for 1 minute."
        labels:
          severity: critical

      - uid: solaris-disk-low
        title: Root Disk Space Low (< 15% free)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 100 * (node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"})
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [15], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
              type: threshold
              refId: C
        for: 5m
        annotations:
          summary: "Root disk free space below 15%"
          description: "Available disk space on / is {{ $values.A.Value }}%."
        labels:
          severity: warning

      - uid: solaris-ram-high
        title: Host RAM Usage > 90%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [90], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
              type: threshold
              refId: C
        for: 5m
        annotations:
          summary: "Host RAM usage above 90%"
          description: "Host memory utilization is {{ $values.A.Value }}%."
        labels:
          severity: warning

      - uid: solaris-cpu-high
        title: Host CPU Usage > 90%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [90], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
              type: threshold
              refId: C
        for: 5m
        annotations:
          summary: "Host CPU usage above 90%"
          description: "Host CPU utilization is {{ $values.A.Value }}%."
        labels:
          severity: warning

      - uid: solaris-api-5xx
        title: API 5xx Error Rate > 5%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 100 * (sum(rate(solaris_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(solaris_http_requests_total[5m])), 0.01))
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [5], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
              type: threshold
              refId: C
        for: 2m
        annotations:
          summary: "API 5xx error rate above 5%"
          description: "API 5xx percentage is {{ $values.A.Value }}%."
        labels:
          severity: critical

      - uid: solaris-pg-long-tx
        title: Postgres Long Transaction (> 600s)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max(pg_stat_activity_max_tx_duration{datname="wuwa_story"})
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [600], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
              type: threshold
              refId: C
        for: 2m
        annotations:
          summary: "Postgres transaction running > 10 minutes"
          description: "Max active transaction duration is {{ $values.A.Value }}s (possible hang or lock)."
        labels:
          severity: warning
